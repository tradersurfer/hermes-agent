<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{HEADLINE}}</title>
<style>
  :root{ --ba-orange:#f7931a; --ba-text:#1a1a1a; --ba-grey:#6b7280; --ba-box:#fff6ea; }
  *{ box-sizing:border-box; }
  body{ margin:0; background:#fff; color:var(--ba-text);
        font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
        line-height:1.7; font-size:17px; }
  .wrap{ max-width:720px; margin:0 auto; padding:40px 20px 80px; }
  .eyebrow{ color:var(--ba-orange); font-weight:700; letter-spacing:.08em;
            text-transform:uppercase; font-size:13px; margin-bottom:8px; }
  h1{ font-size:30px; line-height:1.25; margin:0 0 12px; font-weight:800; }
  .byline{ color:var(--ba-grey); font-size:13px; margin-bottom:24px; }
  .takeaway{ background:var(--ba-box); border-left:4px solid var(--ba-orange);
             padding:16px 20px; border-radius:6px; margin:0 0 28px; }
  .takeaway .label{ font-weight:700; color:var(--ba-orange); font-size:13px;
             text-transform:uppercase; letter-spacing:.05em; display:block; margin-bottom:6px; }
  h2{ font-size:22px; margin:34px 0 10px; font-weight:700; }
  h3{ font-size:18px; margin:26px 0 8px; font-weight:700; }
  p{ margin:0 0 16px; }
  a{ color:var(--ba-orange); text-decoration:none; }
  a:hover{ text-decoration:underline; }
  blockquote{ margin:20px 0; padding:14px 18px; border-left:4px solid var(--ba-orange);
             background:#fafafa; font-style:italic; }
  .sources{ margin-top:36px; padding-top:20px; border-top:1px solid #eee; }
  .sources h3{ font-size:15px; text-transform:uppercase; letter-spacing:.05em; color:var(--ba-grey); }
  .sources ul{ margin:8px 0 0; padding-left:20px; }
  .sources li{ margin-bottom:6px; font-size:15px; }
  hr{ border:none; border-top:1px solid #eee; margin:36px 0; }
  .muted{ color:var(--ba-grey); font-style:italic; }
  .x-embed{ margin:26px 0; border:1px solid #eaeaea; border-radius:14px; overflow:hidden;
            background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.04); }
  .x-embed-link{ display:block; padding:16px 18px; text-decoration:none; color:inherit; }
  .x-embed-link:hover{ background:#fafafa; }
  .x-embed-handle{ display:block; color:#0f1419; font-weight:700; font-size:15px; margin-bottom:6px; }
  .x-embed-text{ display:block; color:#0f1419; font-size:16px; line-height:1.5; white-space:pre-wrap; }
  .x-embed-src{ display:block; margin-top:8px; color:var(--ba-orange); font-size:12px;
                text-transform:uppercase; letter-spacing:.05em; font-weight:700; }
</style>
</head>
<body>
<div class="wrap">

  <div class="eyebrow">{{CATEGORY}}</div>
  <h1>{{HEADLINE}}</h1>
  <div class="byline">Published {{DATE}} · By Archie</div>

  <div class="takeaway">
    <span class="label">Key Takeaway</span>
    {{KEY_TAKEAWAY_PARAGRAPHS}}
  </div>

  <!-- IMAGE PLACEHOLDER: {{ASSET_PATH}} -->
  {{ARTICLE_BODY_HTML}}

  {{X_POSTS_HTML}}

  <hr>

  <div class="sources">
    <h3>Sources &amp; References</h3>
    <ul>
      {{SOURCES_LIST}}
    </ul>
  </div>

</div>
</body>
</html>
